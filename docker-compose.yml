services:
  postgres:
    image: postgres:16-alpine
    container_name: gitfolio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gitfolio
      POSTGRES_PASSWORD: gitfolio
      POSTGRES_DB: gitfolio_dev
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitfolio -d gitfolio_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: gitfolio_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
  redis_data:
